<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Auth Test</title>
  <style>
    body { font-family: sans-serif; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; gap: 1rem; }
    button { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; }
    #login-btn { background: #5865f2; color: #fff; }
    #logout-btn { background: #666; color: #fff; display: none; }
    #status { background: #16213e; padding: 1rem 2rem; border-radius: 8px; text-align: center; }
  </style>
</head>
<body>
  <h2>Test de Autenticación</h2>
  <div id="status">Cargando...</div>
  <button id="login-btn">Login con Discord</button>
  <button id="logout-btn">Cerrar sesión</button>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    const statusEl  = document.getElementById('status');
    const loginBtn  = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');

    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        const user = session.user;
        statusEl.innerHTML = `✅ Logged in como <strong>${user.user_metadata.full_name || user.email}</strong>`;
        loginBtn.style.display  = 'none';
        logoutBtn.style.display = 'block';
      } else {
        statusEl.textContent = '❌ No hay sesión activa';
        loginBtn.style.display  = 'block';
        logoutBtn.style.display = 'none';
      }
    }

    loginBtn.addEventListener('click', () => {
      supabaseClient.auth.signInWithOAuth({
        provider: 'discord',
        options: { redirectTo: window.location.href }
      });
    });

    logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      checkSession();
    });

    supabaseClient.auth.onAuthStateChange(() => checkSession());
    checkSession();
  </script>
</body>
</html>
